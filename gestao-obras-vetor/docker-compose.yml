version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB deve ser definido}
      POSTGRES_USER: ${POSTGRES_USER:-gestao_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost-only access for maintenance; never publish PostgreSQL to the internet.
      - "127.0.0.1:55432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestao_user} -d ${POSTGRES_DB:?POSTGRES_DB deve ser definido}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    platform: linux/amd64
    container_name: gestao-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL deve ser definido}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD deve ser definido}
      # pgAdmin is accessed only through Caddy over HTTPS.
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: 'True'
      # Cloudflare may use different proxy IPs during the same browser session.
      # Binding sessions to that changing address causes an authentication loop.
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: '1'
      PGPASS_FILE: /pgpass
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
    ports:
      # Optional local-only troubleshooting access. It is never reachable from the network.
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: gestao-caddy
    depends_on:
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN deve ser definido antes de executar docker compose}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL deve ser definido antes de executar docker compose}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gestao-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - APP_DATA_DIR=${APP_DATA_DIR:?APP_DATA_DIR deve ser definido antes de executar docker compose}
      - FRONTEND_URL=https://${APP_DOMAIN:?APP_DOMAIN deve ser definido antes de executar docker compose}
      - APP_BASE_URL=https://${APP_DOMAIN:?APP_DOMAIN deve ser definido antes de executar docker compose}
      - PUBLIC_FILE_BASE_URL=https://${APP_DOMAIN:?APP_DOMAIN deve ser definido antes de executar docker compose}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?POSTGRES_DB deve ser definido}
      - DB_USER=${POSTGRES_APP_USER:-gestao_app}
      - DB_PASSWORD=${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      - DB_APP_USER=${POSTGRES_APP_USER:-gestao_app}
      - DB_APP_PASSWORD=${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      - DB_MIGRATIONS_USER=${POSTGRES_USER:-gestao_user}
      - DB_MIGRATIONS_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR deve ser definido antes de executar docker compose}/uploads:/app/uploads
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gestao-frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  caddy_data:
  caddy_config:

# Nota: O frontend serve os arquivos estáticos via Nginx e encaminha /api para o serviço 'backend'.
