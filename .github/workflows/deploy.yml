name: Deploy Vetor

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vetor-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            cd "${{ secrets.APP_DIR }}"
            export APP_DATA_DIR="/home/ubuntu/app_data/gestao-obras-vetor"

            CURRENT_BRANCH="$(git branch --show-current)"
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "Branch inesperada no servidor: $CURRENT_BRANCH"
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "Servidor possui alteracoes locais. Abortando deploy."
              git status --short
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            if [ -f docker-compose.yml ]; then
              COMPOSE_DIR="$PWD"
            elif [ -f gestao-obras-vetor/docker-compose.yml ]; then
              COMPOSE_DIR="$PWD/gestao-obras-vetor"
            else
              echo "docker-compose.yml nao encontrado no APP_DIR nem em gestao-obras-vetor/."
              exit 1
            fi

            cd "$COMPOSE_DIR"

            if [ ! -f scripts/validate_data_dir.sh ]; then
              echo "Script de validacao de APP_DATA_DIR ausente."
              exit 1
            fi

            sh scripts/validate_data_dir.sh "$APP_DATA_DIR"
            docker compose config >/dev/null

            docker compose up -d --build
            docker compose ps

            for i in $(seq 1 30); do
              if curl -fsS "${{ secrets.HEALTH_URL }}"; then
                echo "Deploy concluido e sistema online."
                exit 0
              fi

              echo "Aguardando sistema subir... tentativa $i"
              sleep 5
            done

            echo "Health check falhou apos deploy."
            docker compose logs --tail=100
            exit 1
